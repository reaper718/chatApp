<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>ChatFlow</h2>
                <span>Messages</span>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    placeholder="Search contacts..."
                    id="searchContacts"
                >
            </div>

            
            <div class="sidebar-section">
                <div class="section-heading">
                    <h3>Groups</h3>
                    <button id="createGroupBtn" type="button">+ Create</button>
                </div>
                <div id="groupsList" class="groups-list"></div>
            </div>

            <div class="sidebar-section">
                <h3>Personal Chats</h3>
                <div id="contactsList" class="contacts-list"></div>
            </div>

        </aside>

        <!-- Chat window -->
        <main class="chat-window">

            <header class="chat-header">
                <div class="avatar" id="chatAvatar">?</div>

                <div>
                    <h3 id="chatName">Select a contact</h3>
                    <p class="online" id="chatStatus">
                        Choose someone to start chatting
                    </p>
                </div>
            </header>

            <section class="messages" id="messages">
                <div class="date-divider">
                    <span>Today</span>
                </div>
            </section>

            <form class="message-form" id="messageForm">
                <label for="mediaInput" class="attachment-button" title="Attach a file">📎</label>
                <input
                    type="file"
                    id="mediaInput"
                    hidden
                    accept="image/*,video/*,.pdf,.txt,.zip,.docx"
                >

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message..."
                    autocomplete="off"
                    required
                    disabled
                >

                <button type="submit" disabled>Send ➤</button>
            </form>

        </main>
    </div>

    
    <div id="createGroupModal" class="modal hidden">
        <div class="modal-content">
            <h2>Create New Group</h2>

            <form id="createGroupForm">
                <label for="groupName">Group Name</label>
                <input
                    type="text"
                    id="groupName"
                    placeholder="Enter group name"
                    required
                >

                <h3>Select Members</h3>
                <div id="groupMembersList"></div>

                <div class="modal-actions">
                    <button type="button" id="cancelGroupBtn">
                        Cancel
                    </button>
                    <button type="submit" id="saveGroupBtn">
                        Create Group
                    </button>
                </div>
            </form>
        </div>
    </div>


    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
